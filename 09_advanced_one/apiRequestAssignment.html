<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgba(27, 127, 128, 0.526);
            height: 100vh;
            color: aliceblue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .cart{
            height: 320px;
            width: 250px;
            background-color: #189ac68a;
            text-align: center;
            align-items: center;
            border-radius: 12px;
            box-shadow: 0px 4px 12px #060606;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .cart p {
            font-size: 20px;
            color: white;
        }
        .cart img{
            height: 170px;
            width: 170px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 4px solid;
        }
        .cart h2{
            font-size: 20px;
            margin: 5px 0px;
        }
    </style>
</head>
<body>
    <div id="userCart" class="cart">
        <p>Loading....</p>
    </div>
</body>
<script>
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary';
    const xhr = new XMLHttpRequest()
    xhr.open('GET',requestUrl)
    // console.log(xhr.readyState);

    // xhr.onreadystatechange = function(){
    xhr.addEventListener("load", function() {

        // console.log(xhr.readyState);
        if(xhr.readyState === 4){

            const data = JSON.parse(this.responseText)  //convert into object
            // console.log(data);
            // console.log(typeof data);

            const cart = document.getElementById('userCart')
            cart.innerHTML = `
                <img src='${data.avatar_url}' alt='useravatar'></img>
                <h2>${data.login}</h2>
                <p>Followers :~ ${data.followers}</P>
            `
        }
    })
    
    xhr.send()
    

</script>
</html>
